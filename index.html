<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contador de exercícios</title>
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--accent:#7c3aed;--accent2:#ff5fa2;--soft:#ede4ff;--ink:#2a1f3d;--mute:#6b5f80;
--bg:color-mix(in srgb,var(--soft) 40%,#fff);--btn:var(--soft);--track:color-mix(in srgb,var(--accent) 20%,#fff);
--red:#e5384f;--yellow:#f5a800;--green:#1fb26b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:color-mix(in srgb,var(--accent) 14%,#16111d);--btn:color-mix(in srgb,var(--accent) 28%,#16111d);--track:color-mix(in srgb,var(--accent) 35%,#16111d);--ink:#f5f0ff;--mute:#b9aed0;--red:#ff6b7d;--yellow:#ffc533;--green:#3ddc97;color-scheme:dark}}
:root[data-theme="dark"]{--bg:color-mix(in srgb,var(--accent) 14%,#16111d);--btn:color-mix(in srgb,var(--accent) 28%,#16111d);--track:color-mix(in srgb,var(--accent) 35%,#16111d);--ink:#f5f0ff;--mute:#b9aed0;--red:#ff6b7d;--yellow:#ffc533;--green:#3ddc97;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px 16px 32px;display:flex;flex-direction:column;gap:22px}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:22px;padding:20px 20px 18px}
h1{font-size:1.4rem;margin:0;font-weight:700}
.hero p{margin:4px 0 0;font-size:.98rem;opacity:.95;text-transform:capitalize}
.sub{color:var(--mute);font-size:.92rem;margin:0}
h2{font-size:1.02rem;margin:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--btn);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;color:var(--ink);font:inherit;font-weight:600;padding:10px 4px;border-radius:999px;min-height:44px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.view[hidden],[hidden]{display:none!important}
.view{display:flex;flex-direction:column;gap:26px}
.ex{display:flex;flex-direction:column;align-items:center;gap:10px}
.name{background:none;border:0;color:var(--ink);font:inherit;font-size:1.05rem;font-weight:650;padding:6px 10px;border-radius:8px;text-align:center}
.dial{position:relative;width:min(72vw,280px);aspect-ratio:1;border:0;background:none;padding:0;border-radius:50%;color:var(--ink);cursor:pointer;touch-action:manipulation}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.pic{position:absolute;inset:20px;border-radius:50%;background-size:cover;background-position:center}
.pic::after{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(30,10,50,.45)}
.pic.noimg{background-image:linear-gradient(135deg,var(--accent),var(--accent2))}
.pic.noimg::after{display:none}
.dial circle{fill:none;stroke-width:14;stroke-linecap:round}
.trk{stroke:var(--track)}
.bar{transition:stroke-dashoffset .25s ease,stroke .25s ease}
.dial:active .face{transform:scale(.95)}
.face{position:absolute;inset:0;z-index:1;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .1s}
.num{font-size:3.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.of{font-size:.95rem;margin-top:4px;opacity:.95}
.done{font-size:1.1rem;font-weight:700;margin-top:6px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.row button,.btn{background:var(--btn);color:var(--ink);border:0;border-radius:999px;padding:10px 18px;font:inherit;font-size:.95rem;min-height:44px}
.btn.main{background:var(--accent);color:#fff;font-weight:600}
.row .danger{color:var(--red)}
#msg{text-align:center;color:var(--mute);font-size:.9rem;min-height:1.2em;margin:0}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head strong{text-transform:capitalize;font-size:1.05rem}
.cal-head button{width:44px;height:44px;border:0;border-radius:50%;background:var(--btn);color:var(--ink);font-size:1.2rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;color:var(--mute);font-size:.8rem;padding:4px 0}
.day{aspect-ratio:1;border:2px solid transparent;border-radius:12px;background:var(--btn);color:var(--ink);font:inherit;font-size:.95rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.day:disabled{opacity:.35}
.day.today{border-color:var(--accent)}
.day.sel{background:var(--accent);color:#fff}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:100%}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--track);display:block}
.day.sel .dots i{box-shadow:0 0 0 1.5px #fff}
.legend{display:flex;gap:14px;justify-content:center;color:var(--mute);font-size:.8rem;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.card{background:var(--btn);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.off{opacity:.7}
.chk{display:flex;align-items:center;gap:10px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.nm{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border-radius:12px;border:2px solid transparent;background:var(--bg);color:var(--ink)}
.goal{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step{width:44px;height:44px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:1.3rem}
.g{width:72px;font:inherit;font-size:1.1rem;font-weight:700;text-align:center;padding:10px 4px;border-radius:12px;border:2px solid transparent;background:var(--bg);color:var(--ink)}
.pal{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:48px;height:48px;border-radius:50%;border:3px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.set-sec{display:flex;flex-direction:column;gap:12px}
.detail{background:var(--btn);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.detail h2{text-transform:capitalize}
.line{display:flex;align-items:center;gap:10px;justify-content:space-between}
.line span{display:flex;align-items:center;gap:8px}
.line i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
@media (prefers-reduced-motion:reduce){.bar,.face{transition:none}}
</style>
</head>
<body>
<main>
<header class="hero"><h1>Exercícios</h1><p id="date"></p></header>
<div class="tabs" role="group" aria-label="Telas">
<button id="tabHoje" aria-pressed="true">Hoje</button>
<button id="tabCal" aria-pressed="false">Calendário</button>
<button id="tabSet" aria-pressed="false">Ajustes</button>
</div>

<div class="view" id="vHoje">
<p class="sub" id="empty" hidden>Nenhum exercício ativado para hoje. Ative em Ajustes.</p>
<div class="view" id="list"></div>
<div class="row" id="todayBtns"><button class="btn main" id="shareToday">Compartilhar status do dia</button><button id="reset">Zerar o dia</button></div>
</div>

<div class="view" id="vCal" hidden>
<div class="cal-head"><button id="prev" aria-label="Mês anterior">‹</button><strong id="mtitle"></strong><button id="next" aria-label="Próximo mês">›</button></div>
<div class="grid" id="grid"></div>
<div class="legend"><span><i style="background:var(--red)"></i>menos de 40%</span><span><i style="background:var(--yellow)"></i>em andamento</span><span><i style="background:var(--green)"></i>meta feita</span></div>
<div class="detail" id="detail"></div>
</div>

<div class="view" id="vSet" hidden>
<div class="set-sec"><h2>Cor do app</h2><div class="pal" id="pal"></div></div>
<div class="set-sec"><h2>Exercícios</h2><p class="sub">Ative os exercícios de cada dia e defina a meta de repetições de cada um.</p><div class="set-sec" id="exlist"></div>
<button class="btn main" id="addEx">Adicionar exercício</button></div>
<input type="file" id="file" accept="image/*" hidden>
</div>

<p id="msg" role="status"></p>
</main>

var PAL={lilas:{n:"Lilás",a:"#7c3aed",b:"#ff5fa2",s:"#ede4ff"},coral:{n:"Coral",a:"#e8454d",b:"#ff9a4c",s:"#ffe3de"},menta:{n:"Menta",a:"#00897b",b:"#35c4f0",s:"#d4f5ee"},sol:{n:"Sol",a:"#e66a00",b:"#ff5f8a",s:"#ffeccc"},oceano:{n:"Oceano",a:"#2563eb",b:"#7b5cff",s:"#dce9ff"}};
var st={ex:null,counts:{},hist:{},theme:"lilas"};
function defEx(n0,n1){return [{id:"e0",name:n0,goal:20,on:true,img:"b0"},{id:"e1",name:n1,goal:20,on:true,img:"b1"}]}
try{
var raw=localStorage.getItem(KEY);
if(raw){var o=JSON.parse(raw);st.ex=o.ex;st.hist=o.hist||{};if(PAL[o.theme])st.theme=o.theme;if(o.date===today)st.counts=o.counts||{}}
else{var r2=localStorage.getItem(OLD);if(r2){var p=JSON.parse(r2),nm=p.names||[];st.ex=defEx(nm[0]||"Vácuo 25/50/100% sentada",nm[1]||"Vácuo 100% deitada");
var hh=p.hist||{};Object.keys(hh).forEach(function(k){var a=hh[k];if(Array.isArray(a))st.hist[k]={e0:[a[0],20,st.ex[0].name],e1:[a[1],20,st.ex[1].name]}});
if(p.date&&p.date>=today&&p.counts)st.counts={e0:p.counts[0],e1:p.counts[1]}}}
}catch(e){}
if(!st.ex||!st.ex.length)st.ex=defEx("Vácuo 25/50/100% sentada","Vácuo 100% deitada");
var tab_="hoje",cy,cm,sel=today;
(function(){var d=new Date();cy=d.getFullYear();cm=d.getMonth()})();
function applyTheme(){var p=PAL[st.theme],s=document.documentElement.style;s.setProperty("--accent",p.a);s.setProperty("--accent2",p.b);s.setProperty("--soft",p.s)}
applyTheme();
function curRec(){var r={};st.ex.forEach(function(e){var n=st.counts[e.id]||0;if(e.on||n>0)r[e.id]=[n,e.goal,e.name]});return r}
function recFor(k){var r=k===today?curRec():(st.hist[k]||{});return Object.keys(r).map(function(id){return {id:id,n:r[id][0],goal:r[id][1],name:r[id][2]}})}
function save(){var r=curRec(),any=Object.keys(r).some(function(id){return r[id][0]>0});if(any)st.hist[today]=r;else delete st.hist[today];
try{localStorage.setItem(KEY,JSON.stringify({date:today,counts:st.counts,ex:st.ex,hist:st.hist,theme:st.theme}))}catch(e){}}
function color(n,g){var p=n/g;return p>=1?"var(--green)":p>=0.4?"var(--yellow)":"var(--red)"}
function hex(n,g){var p=n/g;return p>=1?"#1fb26b":p>=0.4?"#f5a800":"#e5384f"}
function imgSrc(e){return e.img==="b0"?IMGS[0]:e.img==="b1"?IMGS[1]:(e.img||null)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function longDate(k,y){return pk(k).toLocaleDateString("pt-BR",y?{weekday:"long",day:"numeric",month:"long",year:"numeric"}:{weekday:"long",day:"numeric",month:"long"})}
document.getElementById("date").textContent=longDate(today);
function setMsg(t){document.getElementById("msg").textContent=t}
function $(id){return document.getElementById(id)}

/* HOJE */
var C=2*Math.PI*90;
function build(e,el){
el.innerHTML='<button class="name" aria-label="Renomear exercício"></button><button class="dial"><span class="pic"></span><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="90"/><circle class="bar" cx="100" cy="100" r="90" stroke-dasharray="'+C+'"/></svg><span class="face"><span class="num"></span><span class="of"></span><span class="done"></span></span></button><div class="row"><button class="undo">Desfazer</button></div>';
var nm=el.querySelector(".name"),dial=el.querySelector(".dial"),bar=el.querySelector(".bar"),num=el.querySelector(".num"),of=el.querySelector(".of"),dn=el.querySelector(".done"),pic=el.querySelector(".pic"),s=imgSrc(e);
if(s)pic.style.backgroundImage="url("+s+")";else pic.classList.add("noimg");
function draw(){var n=st.counts[e.id]||0,g=e.goal,p=Math.min(n/g,1);
nm.textContent=e.name;bar.style.strokeDashoffset=C*(1-p);bar.style.stroke=color(n,g);
num.textContent=n;of.textContent="de "+g;dn.textContent=n>=g?"100% concluído ✓":Math.round(p*100)+"%";
dial.setAttribute("aria-label",e.name+": "+n+" de "+g+". Toque para somar 1.")}
dial.addEventListener("click",function(){var n=(st.counts[e.id]||0)+1;st.counts[e.id]=n;if(navigator.vibrate){try{navigator.vibrate(n===e.goal?[60,40,60]:15)}catch(x){}}save();draw()});
el.querySelector(".undo").addEventListener("click",function(){if((st.counts[e.id]||0)>0){st.counts[e.id]--;save();draw()}});
nm.addEventListener("click",function(){var v=prompt("Nome do exercício:",e.name);if(v&&v.trim()){e.name=v.trim().slice(0,40);save();draw()}});
draw()}
function renderToday(){var L=$("list"),act=st.ex.filter(function(e){return e.on});L.innerHTML="";
$("empty").hidden=act.length>0;$("todayBtns").hidden=act.length===0;
act.forEach(function(e){var s=document.createElement("section");s.className="ex";L.appendChild(s);build(e,s)})}
$("reset").addEventListener("click",function(){if(confirm("Zerar os contadores de hoje?")){st.counts={};save();renderToday()}});

/* abas */
function tab(t){tab_=t;$("vHoje").hidden=t!=="hoje";$("vCal").hidden=t!=="cal";$("vSet").hidden=t!=="set";
$("tabHoje").setAttribute("aria-pressed",t==="hoje");$("tabCal").setAttribute("aria-pressed",t==="cal");$("tabSet").setAttribute("aria-pressed",t==="set");
setMsg("");if(t==="hoje")renderToday();if(t==="cal")renderCal();if(t==="set")renderSet()}
$("tabHoje").addEventListener("click",function(){tab("hoje")});$("tabCal").addEventListener("click",function(){tab("cal")});$("tabSet").addEventListener("click",function(){tab("set")});

/* CALENDÁRIO */
function dots(r){return '<span class="dots">'+r.map(function(x){return '<i style="background:'+(x.n>0?color(x.n,x.goal):'')+'"></i>'}).join("")+"</span>"}
function renderCal(){var h="",wd=["D","S","T","Q","Q","S","S"];
$("mtitle").textContent=new Date(cy,cm,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
for(var w=0;w<7;w++)h+='<div class="wd" aria-hidden="true">'+wd[w]+"</div>";
var first=new Date(cy,cm,1).getDay(),n=new Date(cy,cm+1,0).getDate();
for(var b=0;b<first;b++)h+="<div></div>";
for(var d=1;d<=n;d++){var k=dk(new Date(cy,cm,d)),r=recFor(k),fut=k>today;
h+='<button class="day'+(k===today?" today":"")+(k===sel?" sel":"")+'" data-k="'+k+'"'+(fut?" disabled":"")+' aria-label="'+longDate(k)+'">'+d+dots(r)+"</button>"}
$("grid").innerHTML=h;
var cur=recFor(sel),done=cur.filter(function(x){return x.n>=x.goal}).length,dt=$("detail");
dt.innerHTML="<h2>"+longDate(sel)+"</h2>"+(cur.length?cur.map(function(x){return '<div class="line"><span><i style="background:'+(x.n>0?color(x.n,x.goal):"var(--track)")+'"></i>'+esc(x.name)+"</span><strong>"+x.n+"/"+x.goal+"</strong></div>"}).join("")+'<div class="sub">Metas concluídas: '+done+" de "+cur.length+'</div><button class="btn main" id="shareSel">Compartilhar este dia</button>':'<div class="sub">Sem registro neste dia.</div>');
var sb=$("shareSel");if(sb)sb.addEventListener("click",function(){share(sel)})}
$("grid").addEventListener("click",function(e){var b=e.target.closest(".day");if(b&&!b.disabled){sel=b.getAttribute("data-k");renderCal()}});
$("prev").addEventListener("click",function(){cm--;if(cm<0){cm=11;cy--}renderCal()});
$("next").addEventListener("click",function(){var d=new Date();if(cy>d.getFullYear()||(cy===d.getFullYear()&&cm>=d.getMonth()))return;cm++;if(cm>11){cm=0;cy++}renderCal()});

/* AJUSTES */
var photoIdx=-1;
function renderSet(){
$("pal").innerHTML=Object.keys(PAL).map(function(k){return '<button class="sw" data-p="'+k+'" aria-label="'+PAL[k].n+'" aria-pressed="'+(st.theme===k)+'" style="background:linear-gradient(135deg,'+PAL[k].a+","+PAL[k].b+')"></button>'}).join("");
$("exlist").innerHTML=st.ex.map(function(e,i){return '<div class="card'+(e.on?"":" off")+'" data-i="'+i+'"><label class="chk"><input type="checkbox" class="on"'+(e.on?" checked":"")+'> Fazer hoje</label><input class="nm" type="text" maxlength="40" value="'+esc(e.name)+'" aria-label="Nome do exercício"><div class="goal"><strong>Meta</strong><button class="step" data-d="-1" aria-label="Diminuir meta">−</button><input class="g" type="number" inputmode="numeric" min="1" max="500" value="'+e.goal+'" aria-label="Meta de repetições"><button class="step" data-d="1" aria-label="Aumentar meta">+</button><span class="sub">repetições</span></div><div class="row"><button class="ph">'+(e.img?"Trocar foto":"Adicionar foto")+"</button>"+(e.img?'<button class="rmph">Tirar foto</button>':"")+'<button class="del danger">Remover</button></div></div>'}).join("")}
function idx(t){var c=t.closest(".card");return c?+c.getAttribute("data-i"):-1}
function clamp(v){v=parseInt(v,10);if(isNaN(v)||v<1)v=1;return Math.min(v,500)}
$("pal").addEventListener("click",function(e){var b=e.target.closest(".sw");if(!b)return;st.theme=b.getAttribute("data-p");applyTheme();save();renderSet()});
$("exlist").addEventListener("input",function(e){var i=idx(e.target);if(i<0)return;var x=st.ex[i];
if(e.target.classList.contains("nm")){x.name=e.target.value.slice(0,40)||"Exercício";save()}
else if(e.target.classList.contains("g")){var v=parseInt(e.target.value,10);if(v>=1&&v<=500){x.goal=v;save()}}});
$("exlist").addEventListener("change",function(e){var i=idx(e.target);if(i<0)return;var x=st.ex[i];
if(e.target.classList.contains("on")){x.on=e.target.checked;e.target.closest(".card").classList.toggle("off",!x.on);save()}
else if(e.target.classList.contains("g")){x.goal=clamp(e.target.value);e.target.value=x.goal;save()}
else if(e.target.classList.contains("nm")){e.target.value=x.name}});
$("exlist").addEventListener("click",function(e){var i=idx(e.target);if(i<0)return;var x=st.ex[i],t=e.target;
if(t.classList.contains("step")){x.goal=clamp(x.goal+(+t.getAttribute("data-d")));t.parentNode.querySelector(".g").value=x.goal;save()}
else if(t.classList.contains("ph")){photoIdx=i;$("file").value="";$("file").click()}
else if(t.classList.contains("rmph")){x.img=null;save();renderSet()}
else if(t.classList.contains("del")){if(confirm("Remover “"+x.name+"”? O histórico dos dias passados continua no calendário.")){delete st.counts[x.id];st.ex.splice(i,1);save();renderSet()}}});
$("addEx").addEventListener("click",function(){st.ex.push({id:"x"+Date.now().toString(36),name:"Novo exercício",goal:10,on:true,img:null});save();renderSet();var l=$("exlist").querySelectorAll(".nm"),n=l[l.length-1];if(n){n.focus();n.select()}});
$("file").addEventListener("change",function(){var f=this.files&&this.files[0];if(!f||photoIdx<0)return;var i=photoIdx,rd=new FileReader();
rd.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=360;c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,360,360);st.ex[i].img=c.toDataURL("image/jpeg",.8);save();renderSet()};im.onerror=function(){setMsg("Não consegui abrir essa imagem.")};im.src=rd.result};rd.readAsDataURL(f)});

/* COMPARTILHAR */
function loadImg(src){return new Promise(function(r){var i=new Image();i.onload=function(){r(i)};i.onerror=function(){r(null)};i.src=src})}
async function makeImage(k){
var items=recFor(k),P=PAL[st.theme];
var imgs=await Promise.all(items.map(function(it){var e=st.ex.find(function(x){return x.id===it.id}),s=e?imgSrc(e):null;return s?loadImg(s):Promise.resolve(null)}));
var rows=Math.ceil(items.length/2),W=1080,top=310,rh=510,H=top+rows*rh+190,cv=document.createElement("canvas");cv.width=W;cv.height=H;
var x=cv.getContext("2d"),F='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
x.fillStyle="#fbf8ff";x.fillRect(0,0,W,H);
var g=x.createLinearGradient(0,0,W,260);g.addColorStop(0,P.a);g.addColorStop(1,P.b);x.fillStyle=g;x.fillRect(0,0,W,250);
x.textAlign="center";x.fillStyle="#fff";x.font="700 62px "+F;x.fillText("Status dos exercícios",W/2,112);
x.font="400 36px "+F;var t=longDate(k,true);x.fillText(t.charAt(0).toUpperCase()+t.slice(1),W/2,182);
var R=150;
items.forEach(function(it,i){
var row=Math.floor(i/2),single=(row===rows-1&&items.length%2===1),cx=single?W/2:(i%2?790:290),cy=top+row*rh+175,p=Math.min(it.n/it.goal,1);
x.lineWidth=24;x.lineCap="round";x.strokeStyle=P.s;x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.stroke();
x.save();x.beginPath();x.arc(cx,cy,R-24,0,Math.PI*2);x.clip();
if(imgs[i]){x.drawImage(imgs[i],cx-R,cy-R,R*2,R*2);x.fillStyle="rgba(30,10,50,.45)";x.fillRect(cx-R,cy-R,R*2,R*2)}
else{var gg=x.createLinearGradient(cx-R,cy-R,cx+R,cy+R);gg.addColorStop(0,P.a);gg.addColorStop(1,P.b);x.fillStyle=gg;x.fillRect(cx-R,cy-R,R*2,R*2)}
x.restore();
if(it.n>0){x.strokeStyle=hex(it.n,it.goal);x.beginPath();x.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*p);x.stroke()}
x.fillStyle="#fff";x.font="700 100px "+F;x.fillText(String(it.n),cx,cy+26);x.font="400 30px "+F;x.fillText("de "+it.goal,cx,cy+72);
var fs=32;x.font="700 "+fs+"px "+F;while(x.measureText(it.name).width>470&&fs>20){fs-=2;x.font="700 "+fs+"px "+F}
x.fillStyle="#2a1f3d";x.fillText(it.name,cx,cy+R+62);
x.fillStyle=hex(it.n,it.goal);x.font="700 38px "+F;x.fillText(it.n>=it.goal?"100% concluído ✓":Math.round(p*100)+"%",cx,cy+R+112)});
var done=items.filter(function(i){return i.n>=i.goal}).length;
x.fillStyle="#2a1f3d";x.font="700 44px "+F;x.fillText("Metas concluídas: "+done+" de "+items.length,W/2,H-105);
if(items.length&&done===items.length){x.fillStyle="#1fb26b";x.font="700 40px "+F;x.fillText("Meta do dia cumprida ✓",W/2,H-48)}
return new Promise(function(r){cv.toBlob(r,"image/png")})}
async function share(k){
if(!recFor(k).length){setMsg("Nada para compartilhar neste dia.");return}
setMsg("Gerando imagem…");
try{var blob=await makeImage(k),name="exercicios-"+k+".png",file=new File([blob],name,{type:"image/png"});
if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"Status dos exercícios"});setMsg("");return}catch(e){if(e&&e.name==="AbortError"){setMsg("");return}}}
var dl=(window.claude&&claude.use)?await claude.use("downloads"):null;
if(dl){await dl.save({filename:name,data:blob});setMsg("Imagem salva. Abra a imagem salva para enviar à fisio.")}
else{var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setMsg("Imagem baixada. Abra-a na galeria para enviar à fisio.")}}
catch(e){setMsg(e&&e.code==="declined"?"":"Não foi possível gerar a imagem.")}}
$("shareToday").addEventListener("click",function(){share(today)});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&dk(new Date())!==today)location.reload()});
save();renderToday();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
